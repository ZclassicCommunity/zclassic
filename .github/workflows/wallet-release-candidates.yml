name: Wallet release candidates
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Candidate platform
        type: choice
        options: [all, linux, macos]
        default: all
concurrency:
  group: wallet-release-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential perl pkg-config xz-utils libsodium-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-util0-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore Linux toolchain
        id: qt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: wallet-focal-qt5.15.19-openssl3.5.9-static-v1
          path: |
            wallet/artifacts/linux-build/qt-static
            wallet/artifacts/linux-build/openssl
      - name: Build Linux toolchain
        run: BUILD_TOOLCHAIN_ONLY=1 sh wallet/contrib/release/linux.sh
      - name: Save Linux toolchain
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: wallet-focal-qt5.15.19-openssl3.5.9-static-v1
          path: |
            wallet/artifacts/linux-build/qt-static
            wallet/artifacts/linux-build/openssl
      - name: Build and check portable Linux candidate
        run: sh wallet/contrib/release/linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta9-linux-candidate
          path: wallet/artifacts/release/*
          if-no-files-found: error
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: brew install qt@5 libsodium
      - name: Build and check macOS candidate
        run: sh wallet/contrib/release/macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta9-macos-candidate
          path: wallet/artifacts/release/*
          if-no-files-found: error
