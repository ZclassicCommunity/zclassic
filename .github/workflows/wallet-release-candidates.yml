name: Wallet release candidates
on:
  workflow_dispatch:
    inputs:
      daemon_run:
        description: Successful daemon candidate run for this exact source commit
        required: true
        type: string
      platform:
        description: Candidate platform
        type: choice
        options: [all, linux, macos]
        default: all
concurrency:
  group: wallet-release-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential perl pkg-config xz-utils libsodium-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-util0-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Trust this container checkout for source identification
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore Linux toolchain
        id: qt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: wallet-focal-qt5.15.19-openssl3.5.9-static-v1
          path: |
            wallet/artifacts/linux-build/qt-static
            wallet/artifacts/linux-build/openssl
      - name: Build Linux toolchain
        run: BUILD_TOOLCHAIN_ONLY=1 sh wallet/contrib/release/linux.sh
      - name: Save Linux toolchain
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: wallet-focal-qt5.15.19-openssl3.5.9-static-v1
          path: |
            wallet/artifacts/linux-build/qt-static
            wallet/artifacts/linux-build/openssl
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: daemon-linux-x86_64
          path: daemon
          run-id: ${{ inputs.daemon_run }}
          github-token: ${{ github.token }}
      - name: Build and check portable Linux candidate
        run: |
          test "$(cat daemon/SOURCE_COMMIT.txt)" = "$(git rev-parse HEAD)"
          cd daemon && sha256sum -c SHA256SUMS.txt && cd ..
          export ZCL_DAEMON="$PWD/daemon/zclassicd"
          export ZCL_DAEMON_SHA256=$(sha256sum "$ZCL_DAEMON" | cut -d' ' -f1)
          chmod +x "$ZCL_DAEMON"
          sh wallet/contrib/release/linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta11-linux-candidate
          path: wallet/artifacts/release/*
          if-no-files-found: error
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: brew install qt@5 libsodium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: daemon-macos-arm64
          path: daemon
          run-id: ${{ inputs.daemon_run }}
          github-token: ${{ github.token }}
      - name: Build and check macOS candidate
        run: |
          test "$(cat daemon/SOURCE_COMMIT.txt)" = "$(git rev-parse HEAD)"
          cd daemon && shasum -a 256 -c SHA256SUMS.txt && cd ..
          export ZCL_DAEMON="$PWD/daemon/zclassicd"
          export ZCL_DAEMON_SHA256=$(shasum -a 256 "$ZCL_DAEMON" | cut -d' ' -f1)
          chmod +x "$ZCL_DAEMON"
          sh wallet/contrib/release/macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta11-macos-candidate
          path: wallet/artifacts/release/*
          if-no-files-found: error
