name: C23 tree root checks
# Manual only: no automatic GitHub Actions runs.
on:
  workflow_dispatch:
jobs:
  c23:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: C23 address and undefined-behavior checks
        run: |
          cc -std=c2x -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc src/zcash/tree_root.c src/test/tree_root_c_tests.c -o /tmp/tree-root-test
          /tmp/tree-root-test
