name: Daemon release candidates
on:
  push:
    branches: [release/beta11-backend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            target: linux
          - platform: windows-x86_64
            target: win64
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils curl ca-certificates git ccache bison python3
      - name: Install Windows cross compiler
        if: matrix.target == 'win64'
        run: |
          apt-get install -y g++-mingw-w64-x86-64
          update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Trust this container checkout for source identification
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: depends-cache
        with:
          path: depends/built
          key: daemon-focal-${{ matrix.platform }}-${{ hashFiles('depends/packages/**', 'depends/patches/**', 'depends/hosts/**') }}
          # The depends recipe hashes and archive checksums reject stale entries.
          # Reuse unchanged packages when one dependency recipe changes instead
          # of fetching and rebuilding the entire toolchain from scratch.
          restore-keys: |
            daemon-focal-${{ matrix.platform }}-
      - name: Build Linux daemon
        if: matrix.target == 'linux'
        run: ZQW_STATIC_GOMP=1 CONFIGURE_FLAGS=--disable-man bash zcutil/build-release.sh linux -j3
      - name: Build static Windows daemon
        if: matrix.target == 'win64'
        run: CONFIGURE_FLAGS='--disable-man LDFLAGS=-static' bash zcutil/build-release.sh win64 -j3
      - name: Save completed dependency builds before packaging
        if: steps.depends-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: depends/built
          key: daemon-focal-${{ matrix.platform }}-${{ hashFiles('depends/packages/**', 'depends/patches/**', 'depends/hosts/**') }}
      - name: Stage and check binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir candidate
          if [ "$TARGET" = win64 ]; then
            cp release/x86_64-w64-mingw32/*.exe candidate/
            for binary in candidate/*.exe; do
              x86_64-w64-mingw32-objdump -p "$binary" | awk '/DLL Name:/ { print tolower($3) }' > imports.txt
              if grep -Ev '^(advapi32|bcrypt|crypt32|iphlpapi|kernel32|msvcrt|netapi32|ntdll|ole32|oleaut32|psapi|secur32|shell32|shlwapi|user32|userenv|version|winmm|ws2_32|wtsapi32)\.dll$' imports.txt; then
                echo "Unexpected runtime DLL dependency in $binary" >&2
                exit 1
              fi
              cat imports.txt >> candidate/validation.txt
            done
          else
            host=$(./depends/config.guess)
            cp release/"$host"/zclassic* candidate/
            for binary in candidate/zclassic*; do
              "$binary" --help >> candidate/validation.txt
              ldd "$binary" >> candidate/validation.txt
              highest=$(objdump -T "$binary" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
              test "$(printf '%s\nGLIBC_2.31\n' "$highest" | sort -V | tail -1)" = GLIBC_2.31
            done
            ! grep -E 'not found|libgomp' candidate/validation.txt
            candidate/zclassicd --version | grep -F '2.1.2-beta13'
          fi
          git rev-parse HEAD > candidate/SOURCE_COMMIT.txt
          cd candidate
          sha256sum zclassic* > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daemon-${{ matrix.platform }}
          path: candidate/
          if-no-files-found: error
  macos:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config coreutils
          sysctl -n hw.ncpu
          xcrun clang --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: depends/built
          key: daemon-macos15-arm64-${{ hashFiles('depends/packages/**', 'depends/patches/**', 'depends/hosts/**', 'depends/builders/**') }}
      - name: Build static macOS daemon with embedded Tor
        run: bash zcutil/build-release.sh linux -j"$(sysctl -n hw.ncpu)" -k
      - name: Save dependency builds
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: depends/built
          key: daemon-macos15-arm64-${{ hashFiles('depends/packages/**', 'depends/patches/**', 'depends/hosts/**', 'depends/builders/**') }}
      - name: Stage and check binaries
        run: |
          set -euo pipefail
          host=$(./depends/config.guess)
          mkdir candidate
          cp release/"$host"/zclassic* candidate/
          ls -l candidate
          file candidate/zclassic*
          for binary in candidate/zclassic*; do
            otool -L "$binary" | tee -a candidate/validation.txt
          done
          # Anything outside /usr/lib and /System would be missing on a user's Mac.
          awk '/^[ \t]+\// { print $1 }' candidate/validation.txt | sort -u > dylibs.txt
          echo "== dylibs linked by the binaries"; cat dylibs.txt
          echo "== non-system dylibs (reported)"; grep -Ev '^(/usr/lib/|/System/)' dylibs.txt || true
          ! grep -E '/opt/homebrew|/usr/local|@rpath|@loader_path' dylibs.txt
          candidate/zclassicd --version | tee -a candidate/validation.txt | head -3
          candidate/zclassicd --version | grep -F '2.1.2-beta13'
          git rev-parse HEAD > candidate/SOURCE_COMMIT.txt
          cd candidate
          shasum -a 256 zclassic* > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - name: Cache Zcash parameters
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Application Support/ZcashParams
          key: zcash-params-v1
      - name: Fetch Zcash parameters
        run: bash zcutil/fetch-params.sh
      - name: Regtest smoke
        timeout-minutes: 60
        run: sh src/c23/test/regtest-smoke.sh --bin "$PWD/candidate" --work "$RUNNER_TEMP/smoke"
      - name: Bounded embedded Tor check
        timeout-minutes: 10
        run: sh .github/scripts/embedded-tor-check.sh "$PWD/candidate" "$RUNNER_TEMP/tor-check" 240
      - name: Confirm no daemon left running
        if: always()
        run: |
          if pgrep -lf 'zclassicd'; then pkill -f zclassicd || true; echo "leftover zclassicd" >&2; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daemon-macos-arm64
          path: candidate/
          if-no-files-found: error
